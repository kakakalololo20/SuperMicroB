name: Supermicro RTX 5 Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supermicro-rtx5-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      BOT_ENV: github
      HEADLESS: "0"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Prepare isolated GitHub state
        id: prepare_state
        run: |
          git fetch origin refs/heads/monitor-state:refs/remotes/origin/monitor-state || true

          if git show-ref --verify --quiet refs/remotes/origin/monitor-state; then
            git worktree add -B monitor-state /tmp/monitor-state origin/monitor-state
          else
            git worktree add --detach /tmp/monitor-state
            git -C /tmp/monitor-state switch --orphan monitor-state
            git -C /tmp/monitor-state clean -fdx
          fi

          mkdir -p github_state

          for file in SuperMicroSeen.json SuperMicroState.json last_success.json; do
            if [ -f "/tmp/monitor-state/github_state/$file" ]; then
              cp "/tmp/monitor-state/github_state/$file" github_state/
            fi
          done

      - name: Run monitor
        run: xvfb-run -a python supermicroBOT.py

      - name: Save isolated GitHub state
        if: always() && steps.prepare_state.outcome == 'success'
        run: |
          mkdir -p /tmp/monitor-state/github_state
          cp -a github_state/. /tmp/monitor-state/github_state/

          git -C /tmp/monitor-state add github_state

          if ! git -C /tmp/monitor-state diff --cached --quiet; then
            git -C /tmp/monitor-state config user.name "github-actions[bot]"
            git -C /tmp/monitor-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C /tmp/monitor-state commit -m "Update Supermicro monitor state"
            git -C /tmp/monitor-state push origin monitor-state
          else
            echo "No state changes."
          fi
