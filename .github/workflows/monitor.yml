name: Supermicro RTX 5 Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supermicro-rtx5-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Find a free proxy that reaches Supermicro
        run: python find_free_proxy.py

      - name: Run monitor
        run: python supermicroBOT.py

      - name: Save state files to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SuperMicroSeen.json SuperMicroState.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Supermicro monitor state"
            git push
          else
            echo "No state changes to commit."
          fi
